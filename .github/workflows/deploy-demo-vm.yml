name: "Deploy Demo VM"

# Clean Windows 11 VM for showing the from-zero install of GitHub Copilot
# CLI and Squad. Same security pattern as deploy-online.yml: one job, one
# human approval (`online` environment), OIDC, private Terraform state,
# ephemeral VNet runner, no plan artifact.
#
# The local admin password is generated here, masked, passed as an
# ephemeral variable, and sent once through azapi sensitive_body: it is
# never written to the plan file, state, or logs. Members sign in with
# Microsoft Entra ID instead.
#
# Before dispatching, start one runner execution:
#   scripts/start-online-runner.ps1

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply | recreate-vm (reset to a clean machine) | destroy"
        required: true
        default: plan
        type: choice
        options: [plan, apply, recreate-vm, destroy]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-demo-vm
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}
  TF_VAR_entra_admin_object_ids: ${{ vars.DEMO_VM_ENTRA_ADMINS || '[]' }}
  TF_VAR_bastion_user_object_ids: ${{ vars.DEMO_VM_BASTION_USERS || '[]' }}

jobs:
  deploy:
    name: Demo VM ${{ inputs.action }}
    runs-on: [self-hosted, aks-online-demo]
    timeout-minutes: 75
    environment: online
    defaults:
      run:
        working-directory: deployments/demo-vm
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          # Write-only arguments need >= 1.11.
          terraform_version: "~1.14"
          terraform_wrapper: false

      - name: Install Azure CLI
        run: |
          if ! command -v az &> /dev/null; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          fi
          az version

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

      - name: Generate ephemeral admin password (masked, never stored)
        run: |
          PASS="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 24)Aa1!"
          echo "::add-mask::$PASS"
          echo "TF_VAR_admin_password=$PASS" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_ONLINE }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            -backend-config="key=demo-vm.tfstate" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID_ONLINE }}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          ARGS=()
          case "${{ inputs.action }}" in
            destroy) ARGS=(-destroy) ;;
            recreate-vm)
              # Replace the VM and everything Azure deletes with it (extension,
              # auto-shutdown schedule, VM-scoped role assignments), so state
              # and Azure never diverge. The NIC is detached and kept.
              mapfile -t REPL < <(terraform state list | grep -E '^azapi_resource\.(vm|aad_login|auto_shutdown|install_pwsh|ra_vm_admin_login)(\[|$)')
              [ "${#REPL[@]}" -gt 0 ] || { echo "::error::No VM in state to recreate; run apply first"; exit 1; }
              for r in "${REPL[@]}"; do ARGS+=("-replace=$r"); done
              printf 'Replacing: %s\n' "${REPL[@]}" ;;
          esac
          terraform plan -input=false -out=tfplan -detailed-exitcode "${ARGS[@]}"
          ec=$?
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -eq 1 ] && exit 1 || exit 0

      - name: Plan summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          {
            echo "### Demo VM plan (${{ inputs.action }})"
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s*# |^Plan:'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: inputs.action != 'plan' && steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Remove local plan file
        if: always()
        run: rm -f tfplan

      - name: Prove the VM is reachable only through Bastion
        if: inputs.action == 'apply' || inputs.action == 'recreate-vm'
        run: |
          set -e
          RG=rg-demo-vm-online
          VM=vm-demo-copilot
          # Landing-zone policies keep updating the VM (agents, platform
          # identity) for several minutes after creation, which holds the
          # VM and our extension in "Updating". Wait for a terminal state
          # (bounded) instead of asserting a moving target.
          for i in $(seq 1 40); do
            VMSTATE=$(az vm get-instance-view -g $RG -n $VM --query "instanceView.statuses[?starts_with(code,'ProvisioningState/')].code | [0]" -o tsv)
            AAD=$(az vm extension show -g $RG --vm-name $VM -n AADLoginForWindows --query provisioningState -o tsv)
            [ "$VMSTATE" = "ProvisioningState/succeeded" ] && [ "$AAD" = "Succeeded" ] && break
            [ "$AAD" = "Failed" ] && break
            echo "Waiting for VM and extension to settle ($i/40): vm=$VMSTATE aad=$AAD"; sleep 30
          done
          POWER=$(az vm get-instance-view -g $RG -n $VM --query "instanceView.statuses[?starts_with(code,'PowerState/')].displayStatus | [0]" -o tsv)
          TL=$(az vm show -g $RG -n $VM --query "securityProfile.securityType" -o tsv)
          SB=$(az vm show -g $RG -n $VM --query "securityProfile.uefiSettings.secureBootEnabled" -o tsv)
          PIP=$(az network nic show -g $RG -n nic-demo-copilot --query "ipConfigurations[0].publicIPAddress.id" -o tsv)
          OPEN=$(az network nsg rule list -g $RG --nsg-name nsg-demo-copilot-vm --query "[?direction=='Inbound' && access=='Allow' && (sourceAddressPrefix=='*' || sourceAddressPrefix=='Internet')] | length(@)" -o tsv)
          # az resource show needs no CLI extension (az network bastion does).
          BAS=$(az resource show -g $RG -n bas-demo-copilot --resource-type Microsoft.Network/bastionHosts --query "join(' ', [properties.provisioningState, to_string(properties.enableTunneling), sku.name])" -o tsv)
          EXTS=$(az vm extension list -g $RG --vm-name $VM --query "join(', ', [].name)" -o tsv)
          PWSH_STATE=$(az vm run-command show -g $RG --vm-name $VM --run-command-name install-pwsh7 --instance-view --query "instanceView.executionState" -o tsv)
          PWSH_OUT=$(az vm run-command show -g $RG --vm-name $VM --run-command-name install-pwsh7 --instance-view --query "instanceView.output" -o tsv | grep -o 'pwsh version: [0-9.]*' || true)
          {
            echo "### Demo VM"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Power / provisioning | $POWER / ${VMSTATE#ProvisioningState/} |"
            echo "| Entra ID login extension | $AAD |"
            echo "| Trusted Launch / Secure Boot | $TL / $SB |"
            echo "| Public IP on VM NIC | ${PIP:-none} |"
            echo "| NSG inbound allows from Internet/* | $OPEN |"
            echo "| Bastion (state, tunneling, SKU) | $BAS |"
            echo "| VM extensions (incl. landing-zone policy) | $EXTS |"
            echo "| PowerShell 7 prerequisite | $PWSH_STATE / ${PWSH_OUT:-no output} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$POWER" = "VM running" ] || { echo "::error::VM is not running"; exit 1; }
          [ "$AAD" = "Succeeded" ] || { echo "::error::Entra login extension not ready: $AAD"; exit 1; }
          [ "$TL" = "TrustedLaunch" ] && [ "$SB" = "true" ] || { echo "::error::Trusted Launch not enabled"; exit 1; }
          [ -z "$PIP" ] || { echo "::error::VM NIC has a public IP"; exit 1; }
          [ "$OPEN" = "0" ] || { echo "::error::VM NSG allows inbound from the internet"; exit 1; }
          [ "$BAS" = "Succeeded true Standard" ] || { echo "::error::Bastion not ready or tunneling disabled: $BAS"; exit 1; }
          [ "$PWSH_STATE" = "Succeeded" ] && [ "$PWSH_OUT" = "pwsh version: 7.6.6" ] || { echo "::error::PowerShell 7.6.6 prerequisite not installed: $PWSH_STATE $PWSH_OUT"; exit 1; }
