name: "Deploy Online"

# Online landing zone deployment of the AKS Automatic module, plus a demo
# app. Separate from the Corp pipeline (deploy.yml).
#
# One job, one human approval:
#   plan -> (apply) -> app deploy -> proof
#
# Why a self-hosted runner:
#   - A tenant-wide Modify policy forces publicNetworkAccess=Disabled on
#     every storage account, so Terraform state is reachable only through a
#     private endpoint in the runner VNet.
#   - The cluster's public API server only accepts the runner's static NAT
#     egress IP (TF_VAR_api_server_authorized_ip_ranges), so the app deploy
#     must run here too.
# The runner is an ephemeral, manually started Azure Container Apps Job
# (labels: self-hosted, aks-online-demo) with no managed identity. Azure
# access comes only from OIDC, gated by the `online` environment (required
# reviewer, protected branches only). The repo is public, so the plan is
# never uploaded as an artifact.
#
# Before dispatching, start one runner execution:
#   scripts/start-online-runner.ps1

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan, deploy the demo app, and prove it over HTTPS"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-online
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}
  TF_VAR_api_server_authorized_ip_ranges: ${{ vars.AKS_AUTHORIZED_IP_RANGES_ONLINE }}

jobs:
  deploy:
    name: Plan, apply, deploy app, prove
    runs-on: [self-hosted, aks-online-demo]
    timeout-minutes: 60
    environment: online
    defaults:
      run:
        working-directory: deployments/online
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Install Azure CLI
        run: |
          if ! command -v az &> /dev/null; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          fi
          az version

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

      - name: Ensure state container exists
        run: |
          az storage container create \
            --name "${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            --auth-mode login -o none

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_ONLINE }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            -backend-config="key=aks-automatic-online.tfstate" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID_ONLINE }}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -out=tfplan -detailed-exitcode
          ec=$?
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -eq 1 ] && exit 1 || exit 0

      - name: Plan summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s*# |^Plan:'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: inputs.apply && steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Remove local plan file
        if: always()
        run: rm -f tfplan

      - name: Install kubectl and kubelogin
        if: inputs.apply
        run: |
          az aks install-cli --only-show-errors
          kubectl version --client
          kubelogin --version

      # The GitHub OIDC assertion is valid for 5 minutes; cluster creation
      # takes longer, so log in again before requesting the AKS API token.
      - name: Azure Login (OIDC, fresh token for AKS)
        if: inputs.apply
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

      - name: Get AKS credentials (Entra ID, no local accounts)
        if: inputs.apply
        run: |
          az aks get-credentials \
            --resource-group rg-aks-online-demo \
            --name aks-online-demo \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          # Namespace-scoped check: the pipeline identity has AKS RBAC
          # Writer and is intentionally not allowed to list cluster nodes.
          kubectl auth can-i create deployments -n online-demo
          kubectl get namespace online-demo --show-labels

      - name: Deploy the demo app
        if: inputs.apply
        working-directory: manifests-online
        run: |
          kubectl apply -k .
          kubectl rollout status deployment/online-demo -n online-demo --timeout=600s
          kubectl get deployment,pod,service,ingress,networkpolicy -n online-demo -o wide
          echo "Least privilege check (expect 'no'):"
          kubectl auth can-i list nodes || true

      - name: Prove the app is reachable over HTTPS only
        if: inputs.apply
        run: |
          ADDRESS=""
          for i in $(seq 1 30); do
            ADDRESS=$(kubectl get ingress online-demo -n online-demo -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$ADDRESS" ] && break
            echo "Waiting for ingress address ($i/30)"; sleep 10
          done
          [ -n "$ADDRESS" ] || { echo "::error::Ingress has no public address"; exit 1; }

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://$ADDRESS/")
          HTTPS_CODE=""
          for i in $(seq 1 18); do
            HTTPS_CODE=$(curl -sk -o /tmp/body.html -w '%{http_code}' "https://$ADDRESS/")
            [ "$HTTPS_CODE" = "200" ] && break
            echo "Waiting for HTTPS 200 ($i/18), got $HTTPS_CODE"; sleep 10
          done
          EGRESS=$(terraform output -raw nat_gateway_public_ip 2>/dev/null || echo "n/a")

          {
            echo "### Online demo app"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Ingress public IP | \`$ADDRESS\` |"
            echo "| \`http://\` response | $HTTP_CODE (expect 308 redirect to HTTPS) |"
            echo "| \`https://\` response | $HTTPS_CODE (expect 200) |"
            echo "| Page title | $(grep -o '<title>[^<]*' /tmp/body.html | sed 's/<title>//') |"
            echo "| Cluster egress (NAT Gateway) | \`$EGRESS\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [ "$HTTP_CODE" = "308" ] || { echo "::error::HTTP did not redirect to HTTPS"; exit 1; }
          [ "$HTTPS_CODE" = "200" ] || { echo "::error::HTTPS did not return 200"; exit 1; }
