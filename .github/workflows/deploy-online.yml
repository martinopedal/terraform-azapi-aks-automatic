name: "Deploy Online"

# Simplified counterpart to deploy.yml for the Online landing zone
# subscription (vars.AZURE_SUBSCRIPTION_ID_ONLINE). Separate file so the
# existing Corp/prod pipeline (deploy.yml) is untouched. The Online
# cluster has a public API server, so apply-online-app can use a
# GitHub-hosted runner to reach it directly.
#
# Why plan/apply run on a self-hosted runner:
# a tenant-wide Modify policy forces publicNetworkAccess=Disabled on every
# storage account, so no GitHub-hosted runner can reach Terraform state.
# The state account is reachable only through a private endpoint in the
# runner VNet. The runner is an ephemeral, manually-started Azure
# Container Apps Job (labels: self-hosted, aks-online-demo) with no
# managed identity; Azure access comes only from OIDC, gated by the
# `online` environment (required reviewer + protected branches only).
#
# Before dispatching this workflow, start one runner execution:
#   scripts/start-online-runner.ps1

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the saved plan after planning"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

jobs:
  plan:
    name: Terraform Plan and Apply
    runs-on: [self-hosted, aks-online-demo]
    timeout-minutes: 45
    environment: online
    defaults:
      run:
        working-directory: deployments/online
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Install Azure CLI
        run: |
          if ! command -v az &> /dev/null; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          fi
          az version

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

      - name: Ensure state container exists
        run: |
          az storage container create \
            --name "${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            --auth-mode login -o none

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_ONLINE }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            -backend-config="key=aks-automatic-online.tfstate" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID_ONLINE }}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -out=tfplan -detailed-exitcode
          ec=$?
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -eq 1 ] && exit 1 || exit 0

      - name: Show plan summary
        if: steps.plan.outputs.exitcode == '2'
        run: terraform show -no-color tfplan | grep -E '^\s*# |^Plan:' | tee -a "$GITHUB_STEP_SUMMARY"

      # Apply in the same job: no plan artifact (artifacts are downloadable
      # by anyone on a public repo and plans can hold sensitive values) and
      # only one ephemeral runner execution needed. The `online` environment
      # approval above gates both plan and apply.
      - name: Terraform Apply
        if: inputs.apply && steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Remove local plan file
        if: always()
        run: rm -f tfplan
  apply-online-app:
    name: Apply Online Demo App Manifests
    needs: plan
    if: inputs.apply
    runs-on: ubuntu-latest
    environment: online
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

      - name: Install kubectl and kubelogin
        run: |
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi
          kubectl version --client

          if ! command -v kubelogin &> /dev/null; then
            curl -LO "https://github.com/Azure/kubelogin/releases/download/v0.1.5/kubelogin-linux-amd64.zip"
            unzip kubelogin-linux-amd64.zip
            chmod +x bin/linux_amd64/kubelogin
            sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
            rm -rf bin kubelogin-linux-amd64.zip
          fi
          kubelogin --version

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-aks-online-demo \
            --name aks-online-demo \
            --overwrite-existing

      - name: Convert kubeconfig to use kubelogin
        run: |
          kubelogin convert-kubeconfig -l azurecli

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply manifests
        run: |
          kubectl apply -k manifests-online/
          echo "Manifests applied successfully"

      - name: Wait for resources
        run: |
          echo "Waiting for deployment to be ready..."
          kubectl wait --for=condition=available --timeout=300s deployment/online-demo -n online-demo || true

          echo "Checking deployment status..."
          kubectl get deployment,pod,service -n online-demo

          echo "Checking Ingress status..."
          kubectl get ingress -n online-demo
          kubectl describe ingress online-demo -n online-demo || true

      - name: Get Ingress address
        run: |
          echo "Waiting for the managed NGINX ingress to get a public address..."
          for i in {1..30}; do
            ADDRESS=$(kubectl get ingress online-demo -n online-demo -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            if [ -n "$ADDRESS" ]; then
              echo "Ingress address: $ADDRESS"
              echo "Showcase URL: http://$ADDRESS/"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done

          echo "Final Ingress status:"
          kubectl get ingress online-demo -n online-demo -o yaml || true
