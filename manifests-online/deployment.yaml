apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-demo
  namespace: online-demo
  labels:
    app: online-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-demo
  template:
    metadata:
      labels:
        app: online-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: online-demo
      containers:
        - name: web
          # Public Microsoft sample (ASP.NET Core 10 LTS, Ubuntu chiseled):
          # distroless, no shell, runs as the non-root "app" user (1654) and
          # listens on 8080, so no privileged port or capability is needed.
          # Pinned by digest (multi-arch index) for a reproducible deploy.
          image: mcr.microsoft.com/dotnet/samples:aspnetapp-chiseled-10.0@sha256:9628a62d214f693b20697c010ba90288a7b2ba0961ece490526e7a51d5a83877
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
